[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutline"
version = "0.1.0"
description = "Champions League season simulator: model fitting, ingest and backtest"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.1", "scipy>=1.14", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cutline = "cutline.cli:main"

[tool.setuptools.packages.find]
include = ["cutline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
